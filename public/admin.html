<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración · Picas y Fijas</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--panel:#111c2e;--line:#263652;--text:#eef4ff;--muted:#9fb0ca;--accent:#22d3ee;--danger:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{border-radius:10px;border:1px solid var(--line);padding:10px 12px;background:#0c1627;color:var(--text)}button{cursor:pointer;background:#17314a}button.primary{background:#0e7490}button.danger{color:#fecdd3;border-color:#7f1d1d}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#0c1627;border-radius:12px;padding:15px}.card b{display:block;font-size:24px;color:var(--accent)}.hidden{display:none}.error{color:var(--danger)}
  </style>
</head>
<body><main>
  <h1>Administración</h1><div class="muted">Picas y Fijas · acceso separado y reservado</div>
  <section id="login" class="panel"><h2>Acceso</h2><div class="row"><input id="username" placeholder="Usuario" autocomplete="username"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button class="primary" id="loginButton">Entrar</button></div><p id="loginError" class="error"></p></section>
  <section id="dashboard" class="hidden">
    <div class="row"><button id="refresh">Actualizar</button><button id="export">Exportar copia</button><button id="logout">Salir</button></div>
    <div class="cards" id="summary"></div>
    <div class="panel"><h2>Usuarios</h2><div style="overflow:auto"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Último acceso</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div></div>
    <div class="panel"><h2>Partidas recientes</h2><div style="overflow:auto"><table><thead><tr><th>Código</th><th>Estado</th><th>Jugadores</th><th>Actualizada</th><th>Acción</th></tr></thead><tbody id="games"></tbody></table></div></div>
    <div class="panel"><h2>Reportes del chat</h2><div style="overflow:auto"><table><thead><tr><th>Mensaje</th><th>Autor</th><th>Reportado por</th><th>Motivo</th><th>Acciones</th></tr></thead><tbody id="reports"></tbody></table></div></div>
    <div class="panel"><h2>Mensajes recientes</h2><div style="overflow:auto"><table><thead><tr><th>Canal</th><th>Autor</th><th>Mensaje</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="messages"></tbody></table></div></div>
  </section>
<script>
let token=localStorage.getItem('pf_admin_session')||'';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function api(action,payload={}){const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json();if(!j.ok)throw Error(j.error||'Error');return j;}
async function login(){try{const r=await api('loginUser',{username:$('username').value.trim(),pin:$('pin').value.trim()});if(r.role!=='admin')throw Error('Este usuario no es administrador.');token=r.sessionToken;localStorage.setItem('pf_admin_session',token);await load();}catch(e){$('loginError').textContent=e.message}}
async function load(){try{const [s,u,g,m,r]=await Promise.all([api('adminSummary'),api('adminUsers'),api('adminGames'),api('adminChatMessages'),api('adminChatReports')]);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('summary').innerHTML=`<div class="card">Usuarios<b>${s.users}</b></div><div class="card">En línea<b>${s.online}</b></div>`+s.games.map(x=>`<div class="card">${esc(x.status)}<b>${x.count}</b></div>`).join('');$('users').innerHTML=u.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${esc(x.last_login_at||'—')}</td><td>${x.blocked_at?'Bloqueado':'Activo'}</td><td><button data-user="${esc(x.username)}" data-block="${x.blocked_at?'0':'1'}">${x.blocked_at?'Desbloquear':'Bloquear'}</button> <button data-pin="${esc(x.username)}">PIN</button> <button data-unmute-chat="${esc(x.username)}">Reactivar chat</button></td></tr>`).join('');$('games').innerHTML=g.games.map(x=>`<tr><td>${esc(x.game_id)}</td><td>${esc(x.status)}</td><td>${esc(x.p1)} / ${esc(x.p2||'—')}</td><td>${esc(x.updated_at)}</td><td>${['waiting','active'].includes(x.status)?`<button class="danger" data-game="${esc(x.game_id)}">Cerrar</button>`:''}</td></tr>`).join('');$('messages').innerHTML=m.messages.map(x=>`<tr><td>${esc(x.roomType+(x.gameId?' '+x.gameId:''))}</td><td>${esc(x.sender||'sistema')}</td><td>${esc(x.deleted?'[eliminado]':x.body)}</td><td>${esc(x.createdAt)}</td><td>${!x.deleted&&x.kind==='user'?`<button class="danger" data-delete-message="${x.id}">Borrar</button> <button data-mute-user="${esc(x.sender)}">Silenciar</button>`:''}</td></tr>`).join('');$('reports').innerHTML=r.reports.map(x=>`<tr><td>${esc(x.deleted_at?'[eliminado]':x.body)}</td><td>${esc(x.sender)}</td><td>${esc(x.reporter)}</td><td>${esc(x.reason)}</td><td>${!x.deleted_at?`<button class="danger" data-delete-message="${x.message_id}">Borrar</button> <button data-mute-user="${esc(x.sender)}">Silenciar</button>`:''}</td></tr>`).join('');}catch(e){token='';localStorage.removeItem('pf_admin_session');$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('loginError').textContent=e.message}}
$('username').addEventListener('keydown',submitLoginOnEnter);$('pin').addEventListener('keydown',submitLoginOnEnter);function submitLoginOnEnter(e){if(e.key!=='Enter'||e.isComposing||e.repeat)return;e.preventDefault();$('loginButton').click()}
$('loginButton').onclick=login;$('refresh').onclick=load;$('export').onclick=async()=>{const data=await api('adminExport');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='picas-y-fijas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};$('logout').onclick=()=>{token='';localStorage.removeItem('pf_admin_session');location.reload()};$('users').onclick=async e=>{const b=e.target.closest('[data-user]');if(b&&confirm('¿Confirmar cambio para '+b.dataset.user+'?')){await api('adminSetBlocked',{target:b.dataset.user,blocked:b.dataset.block});load();return}const p=e.target.closest('[data-pin]');if(p){const newPin=prompt('Nuevo PIN de 4 a 8 dígitos para '+p.dataset.pin);if(newPin!==null){await api('adminResetPin',{target:p.dataset.pin,newPin});alert('PIN actualizado; las sesiones anteriores se cerraron.')}return}const u=e.target.closest('[data-unmute-chat]');if(u&&confirm('¿Reactivar el chat de '+u.dataset.unmuteChat+'?')){await api('adminUnmuteChatUser',{target:u.dataset.unmuteChat});load();}};$('games').onclick=async e=>{const b=e.target.closest('[data-game]');if(b&&confirm('¿Cerrar la partida '+b.dataset.game+'?')){await api('adminCloseGame',{target:b.dataset.game});load()}};if(token)load();
async function chatAdminClick(e){const d=e.target.closest('[data-delete-message]');if(d&&confirm('¿Borrar este mensaje?')){await api('adminDeleteChatMessage',{messageId:d.dataset.deleteMessage});await load();return;}const m=e.target.closest('[data-mute-user]');if(m){const choice=prompt('Duración: 15, 60, 1440 minutos o 0 para permanente','60');if(choice!==null){await api('adminMuteChatUser',{target:m.dataset.muteUser,minutes:choice});await load();}}}
$('messages').onclick=chatAdminClick;$('reports').onclick=chatAdminClick;
</script></main></body></html>
